<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
    <h2>ordered list</h2>
    <ol type="I">
        <li>apple</li>
        <li>banana</li>
        <li>sugarcane</li>
        <li>pear</li>
        <li>strawberry</li>
    </ol>
    <h2>unordered list</h2>
    <ul type="square">
        <li>apple</li>
        <li>banana</li>
        <li>sugarcane</li>
        <li>pear</li>
        <li>strawberry</li>
    </ul>
</body>
</html>
