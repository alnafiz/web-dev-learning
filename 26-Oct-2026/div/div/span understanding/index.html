<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Links</title>
    <!-- এখানে CSS ফাইলটি লিংক করা হয়েছে -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="social-container">
        <h3>Connect with Us</h3>
        
        <span class="social-link youtube">
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
        </span>
        <span class="social-link facebook">
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
        </span>
        <span class="social-link messenger">
            <a href="https://www.messenger.com" target="_blank">Messenger</a>
        </span>
        <span class="social-link instagram">
            <a href="https://www.instagram.com" target="_blank">Instagram</a>
        </span>
        <span class="social-link linkedin">
            <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
        </span>
    </div>

</body>
</html>
