<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 2 - Rowspan and Colspan</title>
</head>

<body>

    <table border="1">
        <caption>PRACTICE 2: ROWSPAN & COLSPAN (Combined)</caption>
        <tr>
            <th>Category</th>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td rowspan="2"><b>Electronics</b></td>
            <td>Laptop</td>
            <td>$800</td>
        </tr>
        <tr>
            <td>Smartphone</td>
            <td>$500</td>
        </tr>
        <tr>
            <td colspan="2"><b>Total Items: 2</b></td>
            <td><b>$1300</b></td>
        </tr>
    </table>

</body>

</html>
