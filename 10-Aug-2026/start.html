<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - HTML & Flexbox Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            padding: 20px;
        }

        /* Navbar Styling */
        nav {
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-radius: 8px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Card Section */
        .card-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }

        .card h2 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .card p {
            color: #475569;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Semantic Navbar -->
    <header>
        <nav>
            <div class="logo">
                <h2>Al Nafiz</h2>
            </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Projects</a></li>
            </ul>
        </nav>
    </header>

    <!-- Card Layout -->
    <main class="card-container">
        <article class="card">
            <h2>10 Aug 2026 — Task</h2>
            <p>HTML Semantic tags (header, nav, article) revision & Flexbox layout implementation completed!</p>
        </article>
    </main>

</body>
</html>
